# Serves the built SPA and proxies API + screenshots to the server container.
# The browser only ever talks to this origin, so /api is same-origin (no CORS).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Allow large MT5 report / screenshot uploads.
  client_max_body_size 25m;

  # AI endpoints need longer timeouts for local LLM inference (Ollama).
  location /api/ai/ {
    proxy_pass http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 30s;
  }

  location /api/ {
    proxy_pass http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /ws/ {
    proxy_pass http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 86400s;
  }

  location /screenshots/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
  }

  # PWA: the service worker and manifest must never be served stale, or a
  # deploy can't replace them. Hashed /assets/* are safe to cache forever.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback — client-side routes resolve to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
