# Trade Journal — production-ish local stack.
#   docker compose up --build      → open http://localhost:8080
# The SQLite database + screenshots persist in the named volume `journal-data`.
services:
  server:
    build: ./server
    environment:
      PORT: "4000"
      # Cloudflare blocks the container's outbound IP from the ForexFactory feed,
      # so server-side polling is disabled — calendar data is supplied instead by
      # scripts/ingest-news.mjs running on the host (a residential IP) and POSTed
      # to /api/news/ingest. Set back to 300 to re-enable in-server polling.
      NEWS_REFRESH_SEC: "${NEWS_REFRESH_SEC:-0}"
      EA_TOKEN: "${EA_TOKEN:-changeme}"
      AI_PROVIDER: "${AI_PROVIDER:-ollama}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-qwen3.5:9b}"
      AI_MODEL_FALLBACK: "${AI_MODEL_FALLBACK:-qwen3.5:9b}"
      OANDA_API_TOKEN: "${OANDA_API_TOKEN:-}"
      OANDA_ENV: "${OANDA_ENV:-practice}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - journal-data:/app/data
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  journal-data:
